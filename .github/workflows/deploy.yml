name: Deploy to VPS

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin
            git checkout dev
            git pull origin dev
            export NODE_ENV=production
            npm ci
            npm run build
            if ! command -v pm2 >/dev/null 2>&1; then
              echo "PM2 is not installed. Run: sudo npm i -g pm2"
              exit 1
            fi
            pm2 delete event-force || true
            pm2 delete eventforce || true
            pm2 start npm --name eventforce --cwd "${{ secrets.DEPLOY_PATH }}" -- start
            pm2 save
